<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #ff5722;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .food {
            background-color: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .food h2 {
            color: #ff5722;
        }

        .food p {
            font-size: 18px;
        }

        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e64a19;
        }

        .cart {
            background-color: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        #total {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Online Food Ordering System</h1>
    <p>Order Your Favourite Food</p>
</header>

<div class="container">

    <h2>Food Menu</h2>

    <div class="menu">

        <div class="food">
            <h2>Pizza</h2>
            <p>₹200</p>
            <button onclick="addFood('Pizza', 200)">Add to Cart</button>
        </div>

        <div class="food">
            <h2>Burger</h2>
            <p>₹120</p>
            <button onclick="addFood('Burger', 120)">Add to Cart</button>
        </div>

        <div class="food">
            <h2>Biryani</h2>
            <p>₹180</p>
            <button onclick="addFood('Biryani', 180)">Add to Cart</button>
        </div>

        <div class="food">
            <h2>Dosa</h2>
            <p>₹80</p>
            <button onclick="addFood('Dosa', 80)">Add to Cart</button>
        </div>

        <div class="food">
            <h2>French Fries</h2>
            <p>₹100</p>
            <button onclick="addFood('French Fries', 100)">Add to Cart</button>
        </div>

        <div class="food">
            <h2>Ice Cream</h2>
            <p>₹70</p>
            <button onclick="addFood('Ice Cream', 70)">Add to Cart</button>
        </div>

    </div>

    <div class="cart">

        <h2>Shopping Cart</h2>

        <div id="cartItems">
            No items added.
        </div>

        <p id="total">Total: ₹0</p>

        <h2>Customer Details</h2>

        <input type="text" id="name" placeholder="Enter your name">

        <input type="text" id="phone" placeholder="Enter phone number">

        <textarea id="address" placeholder="Enter delivery address"></textarea>

        <button onclick="placeOrder()">Place Order</button>

    </div>

</div>

<script>

    let cart = [];
    let total = 0;

    function addFood(name, price) {

        cart.push({
            name: name,
            price: price
        });

        total = total + price;

        displayCart();
    }

    function displayCart() {

        let cartItems = document.getElementById("cartItems");

        cartItems.innerHTML = "";

        if (cart.length === 0) {
            cartItems.innerHTML = "No items added.";
        }

        for (let i = 0; i < cart.length; i++) {

            cartItems.innerHTML +=
                "<p>" +
                (i + 1) +
                ". " +
                cart[i].name +
                " - ₹" +
                cart[i].price +
                "</p>";
        }

        document.getElementById("total").innerHTML =
            "Total: ₹" + total;
    }

    function placeOrder() {

        let name = document.getElementById("name").value;
        let phone = document.getElementById("phone").value;
        let address = document.getElementById("address").value;

        if (name === "" || phone === "" || address === "") {

            alert("Please enter all customer details.");

        } else if (cart.length === 0) {

            alert("Please add food to the cart.");

        } else {

            alert(
                "Order placed successfully!\n\n" +
                "Customer: " + name +
                "\nTotal: ₹" + total
            );
        }
    }

</script>

</body>
</html>
